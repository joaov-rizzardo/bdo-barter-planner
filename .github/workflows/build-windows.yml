# Gera o .exe do BDO Barter Planner para Windows.
# Rode em Actions > Build Windows > Run workflow, ou empurre uma tag v*.
# O projeto está na raiz do repositório: nada de working-directory aqui.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache do npm em passo próprio: o `cache: npm` do setup-node falha o job
      # quando não encontra o package-lock.json no caminho esperado.
      - name: Cache do npm
        if: hashFiles('package-lock.json') != ''
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json não está no repositório; usando npm install."
            npm install
          fi

      # Passos separados porque, no PowerShell do runner, só o código de saída
      # do último comando do bloco marcaria o job como falho.
      - name: Testes
        run: npm run test:run

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build do app (exe + instaladores)
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: bdo-barter-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
