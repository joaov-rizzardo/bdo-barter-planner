[package]
name = "bdo-barter"
version = "0.1.0"
description = "Planejador de permutas (barter) para Black Desert Online"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bdo_barter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: inspecionar o WebView no build de release (botão direito > Inspecionar).
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
